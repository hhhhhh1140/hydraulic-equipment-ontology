name: Publish interactive demo

on:
  push:
    branches: [main]
    paths:
      - 'visualization/**'
      - 'data/industrial-demo/**'
      - 'model/**'
      - 'queries/industrial/**'
      - 'scripts/build_industrial.py'
      - 'tests/**'
      - 'service/**'
      - 'requirements.txt'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Verify pilot data and workflow
        run: |
          python3 -m venv .validation
          .validation/bin/python -m pip install -r requirements.txt
          .validation/bin/python scripts/build_industrial.py
          git diff --exit-code -- model/industrial/replay.ttl model/industrial/replay.json visualization/pilot-data.js
          .validation/bin/python -m unittest discover -s tests -p 'test_industrial.py'
          node --test tests/*.test.cjs
      - name: Stage demo assets
        run: |
          mkdir -p _site
          cp visualization/index.html visualization/*.js visualization/styles.css _site/
          cp -R visualization/vendor _site/vendor
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deploy
