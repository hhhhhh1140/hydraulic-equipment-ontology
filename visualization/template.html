<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>液压设备知识图谱</title>
<link rel="stylesheet" href="vendor/vis-network.min.css">
<link rel="stylesheet" href="styles.css">
<script defer src="vendor/vis-network.min.js"></script>
<script defer src="simulation-model.js"></script>
<script defer src="app.js"></script>
<script defer src="graph.js"></script>
<script defer src="sandbox.js"></script>
</head>
<body>
<header class="app-header">
  <h1>液压设备知识图谱</h1>
  <nav class="nav" aria-label="图谱工作区">
    <button id="tab-graph" aria-pressed="true" aria-controls="panel-graph">关系图谱</button>
    <button id="tab-evidence" aria-pressed="false" aria-controls="panel-evidence">周期与证据</button>
    <button id="tab-sandbox" aria-pressed="false" aria-controls="panel-sandbox">OntoOS 试算</button>
  </nav>
</header>
<main>
<section id="panel-graph" aria-labelledby="tab-graph">
  <div class="graph-layout">
    <aside class="sidebar">
      <h2 class="sidebar-title">液压设备状态监测</h2>
      <p id="graph-stats" class="muted small" aria-live="polite"></p>
      <div class="field">
        <label for="graph-scope">图谱范围</label>
        <select id="graph-scope"><option value="instances">设备与当前周期</option><option value="schema">本体概念模型</option></select>
      </div>
      <p id="graph-cycle" class="muted small"></p>
      <form id="graph-search" class="search">
        <input type="search" id="graph-query" list="graph-names" aria-label="搜索实体" placeholder="搜索实体，如：液压泵">
        <datalist id="graph-names"></datalist>
        <button>定位</button>
      </form>
      <p id="graph-search-status" class="small" aria-live="polite"></p>
      <div class="graph-controls">
        <label for="graph-hops">邻域</label>
        <select id="graph-hops"><option value="0">全图</option><option value="1">一跳</option><option value="2">两跳</option></select>
        <button id="graph-fit" type="button">适应画布</button>
        <label class="check"><input id="graph-labels" type="checkbox">关系名</label>
      </div>
      <h3>实体类型</h3>
      <div id="graph-types" class="checks"></div>
      <h3>三元组来源</h3>
      <div id="graph-sources" class="checks"></div>
      <h3>关系</h3>
      <div id="graph-relations" class="checks"></div>
      <h3>节点详情</h3>
      <div id="graph-detail" class="small" aria-live="polite">选择图上的节点，或搜索实体以查看入边、出边和数据来源。</div>
    </aside>
    <div class="graph-main">
      <div id="network" aria-label="液压设备知识图谱，支持拖动、缩放和选择节点"></div>
      <p id="graph-empty" class="empty-note" hidden>当前筛选没有可显示的节点。</p>
      <p id="graph-error" class="empty-note" role="alert" hidden>图谱组件加载失败。请保留项目中的 visualization/vendor 目录。</p>
    </div>
  </div>
</section>
<section id="panel-evidence" class="content" aria-labelledby="tab-evidence" hidden>
    <div class="viz-controls">
      <label class="form-label">工况筛选
        <select class="form-select" id="hy-filter">
          <option value="all">全部试验周期</option>
          <option value="severe">严重泵内泄漏</option>
          <option value="both">严重泵内泄漏 + 蓄能器 90 bar</option>
        </select>
      </label>
      <label class="form-label">试验周期（原始行号）
        <select class="form-select" id="hy-cycle"></select>
      </label>
    </div>
    <p id="hy-state" aria-live="polite"></p>
    <section aria-labelledby="hy-assess-head">
      <h2 id="hy-assess-head">部件工况</h2>
      <table class="table table-sm" aria-labelledby="hy-assess-head">
        <thead><tr><th scope="col">受试部件</th><th scope="col">原始值</th><th scope="col">标签含义</th></tr></thead>
        <tbody id="hy-assessments"></tbody>
      </table>
    </section>
    <section aria-labelledby="hy-signals-head">
      <h2 id="hy-signals-head">同周期信号</h2>
      <table class="table table-sm" aria-labelledby="hy-signals-head">
        <thead><tr><th scope="col">通道</th><th scope="col">周期均值</th><th scope="col">原始文件</th></tr></thead>
        <tbody id="hy-signals"></tbody>
      </table>
    </section>
    <p class="text-small text-muted">工况来自 profile.txt。同一周期的标签与各通道信号共用原始行号。<a href="https://doi.org/10.24432/C5CW21" target="_blank" rel="noopener">UCI 数据来源</a></p>
</section>
<section id="panel-sandbox" class="content sandbox" aria-labelledby="tab-sandbox" hidden>
  <h2>设备维护方案试算</h2>
  <p class="muted">使用实测工况作为起点。维护用时、优先级和恢复效果是可检查的演示规则。</p>
  <div class="panel baseline">
    <h3>实测起点</h3>
    <p id="sandbox-baseline"></p>
    <div id="sandbox-measured"></div>
    <button id="sandbox-pick-cycle" type="button">更换实测周期</button>
  </div>
  <div class="viz-controls">
    <label class="field">方案 A<select id="plan-a"></select></label>
    <label class="field">方案 B<select id="plan-b"></select></label>
    <label class="field">试算步数<select id="sandbox-horizon">
      <option value="4">4 步</option><option value="8" selected>8 步</option><option value="12">12 步</option>
    </select></label>
  </div>
  <div class="sandbox-controls">
    <button id="sandbox-reset" type="button">回到起点</button>
    <button id="sandbox-step" class="primary" type="button">推进一步</button>
    <button id="sandbox-end" type="button">运行到终点</button>
    <span id="sandbox-time" class="muted small" aria-live="polite"></span>
  </div>
  <div class="plan-grid">
    <article id="sandbox-a" class="panel"></article>
    <article id="sandbox-b" class="panel"></article>
  </div>
  <details class="panel">
    <summary>查看模型规则和优先级</summary>
    <ul id="sandbox-rules"></ul>
  </details>
</section>
</main>
<script type="application/json" id="hyd447-data">__DATA__</script>
</body>
</html>
